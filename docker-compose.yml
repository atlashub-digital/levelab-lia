services:
  lia-core:
    build:
      context: .
    container_name: levelab-lia-core
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8095}:${PORT:-8095}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8095}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lia-net

networks:
  lia-net:
    driver: bridge
